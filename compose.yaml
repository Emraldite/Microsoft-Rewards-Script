services:
    microsoft-rewards-script-v3:
        profiles: ['v3']
        # Immutable snapshot of this fork immediately before the v4 migration.
        build:
            context: https://github.com/Emraldite/Microsoft-Rewards-Script.git#980dce243fa44a2f14409fde511f06f0c4e0d555
        image: microsoft-rewards-script:v3-local
        container_name: microsoft-rewards-script
        restart: unless-stopped
        volumes:
            - ./config-v3:/usr/src/microsoft-rewards-script/dist/config:z
            - ./sessions-v3:/usr/src/microsoft-rewards-script/dist/browser/sessions:z
            - ./logs-v3:/usr/src/microsoft-rewards-script/logs:z
        env_file:
            - path: .env
        environment:
            TZ: 'America/Chicago'
            NODE_ENV: 'production'
            CRON_SCHEDULE: '0 7 * * *'
            RUN_ON_START: 'true'
            SKIP_RANDOM_SLEEP: 'false'
            #RUN_ARGS: '-extraDesktopSearches 100'
            #MIN_SLEEP_MINUTES: '5'
            #MAX_SLEEP_MINUTES: '50'
            #STUCK_PROCESS_TIMEOUT_HOURS: '8'
        healthcheck:
            test: ['CMD', 'sh', '-c', 'pgrep cron > /dev/null || exit 1']
            interval: 60s
            timeout: 10s
            retries: 3
            start_period: 30s
        security_opt:
            - no-new-privileges:true

    microsoft-rewards-script-v4:
        profiles: ['v4']
        build:
            context: .
        image: microsoft-rewards-script:v4-local
        container_name: microsoft-rewards-script
        restart: unless-stopped
        volumes:
            - ./config:/usr/src/microsoft-rewards-script/config:z
            - ./sessions:/usr/src/microsoft-rewards-script/sessions:z
            - ./logs:/usr/src/microsoft-rewards-script/logs:z
        env_file:
            - path: .env
        environment:
            TZ: 'America/Chicago'
            NODE_ENV: 'production'
            CRON_SCHEDULE: '0 7 * * *'
            BONUS_CRON_SCHEDULE: '15 * * * *'
            RUN_ON_START: 'true'
            SKIP_RANDOM_SLEEP: 'false'
            #RUN_ARGS: '-extraDesktopSearches 100'
            #MIN_SLEEP_MINUTES: '5'
            #MAX_SLEEP_MINUTES: '50'
            #STUCK_PROCESS_TIMEOUT_HOURS: '8'
        healthcheck:
            test: ['CMD', 'sh', '-c', 'pgrep cron > /dev/null || exit 1']
            interval: 60s
            timeout: 10s
            retries: 3
            start_period: 30s
        security_opt:
            - no-new-privileges:true
